name: build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenQCY.Desktop.csproj -r win-x64

      - name: Build
        run: dotnet build OpenQCY.Desktop.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --no-restore

      - name: Publish portable build
        run: dotnet publish OpenQCY.Desktop.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true --no-restore -o artifacts/OpenQCY-Desktop-win-x64

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OpenQCY-Desktop-win-x64
          path: artifacts/OpenQCY-Desktop-win-x64
