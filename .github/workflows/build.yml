name: build

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore protocol tests
        run: dotnet restore tests/OpenQCY.Desktop.Tests.csproj

      - name: Test protocol
        run: dotnet test tests/OpenQCY.Desktop.Tests.csproj -c Release --no-restore

      - name: Restore desktop app
        run: dotnet restore OpenQCY.Desktop.csproj -r win-x64 -p:PublishReadyToRun=true

      - name: Build desktop app
        run: dotnet build OpenQCY.Desktop.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --no-restore

      - name: Build diagnostic probe
        run: dotnet build Diagnostics/OpenQCY.Probe/OpenQCY.Probe.csproj -c Release

      - name: Publish portable build
        run: dotnet publish OpenQCY.Desktop.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true --no-restore -o artifacts/publish

      - name: Install pinned Inno Setup
        shell: pwsh
        run: ./scripts/install-inno.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version 0.1.0 -SkipPublish

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: OpenQCY-Desktop-win-x64
          path: artifacts/publish

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: OpenQCY-Desktop-Setup
          path: artifacts/installer/OpenQCY-Desktop-Setup.exe
